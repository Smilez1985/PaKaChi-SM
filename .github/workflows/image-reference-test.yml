name: PaKaChi image reference model regression
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/image-reference-test.yml'
      - 'scripts/check-dependency-audit.mjs'
      - 'src/image-reference.ts'
      - 'src/image-reference-detection.ts'
      - 'src/main.ts'
      - 'src/studio-data.ts'
      - 'src/studio-form-model-pair.ts'
      - 'src/studio-editor.ts'
      - 'src/image-reference-crop.ts'
      - 'src/image-reference-editor.ts'
      - 'tests/image-reference-detection.test.ts'
      - 'src/generation-panel.ts'
      - 'src/ai-job-types.ts'
      - 'src/generation-adapter.ts'
      - 'server/generation.mjs'
      - 'tests/generation-service.test.mjs'
      - 'src/style.css'
      - 'tests/image-reference.test.ts'
      - 'tests/studio-form-model-pair.test.ts'
      - 'src/studio-landmark-projection.ts'
      - 'tests/studio-landmark-projection.test.ts'
      - 'src/image-reference-cluster-pipeline.ts'
      - 'tests/image-reference-cluster-pipeline.test.ts'
      - 'tests/image-reference-crop.test.ts'
      - 'tests/generation-panel.test.ts'
      - 'tests/e2e/image-reference-crop.spec.ts'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit dependencies (including documented upstream exception)
        run: npm run audit:dependencies
      - name: Test image reference hierarchy and generation gate
        run: node --test tests/image-reference.test.ts tests/image-reference-detection.test.ts
      - name: Test calibrated landmark projection and image-to-cluster bridge
        run: node --test tests/studio-landmark-projection.test.ts tests/image-reference-cluster-pipeline.test.ts
      - name: Test source-region crop planning
        run: node --test tests/image-reference-crop.test.ts
      - name: Test generation panel gating
        run: node --test tests/generation-panel.test.ts
      - name: Test generation HTTP transport and provenance sidecar
        run: node --test tests/generation-service.test.mjs
      - name: Test persisted image-reference and paired form-model metadata
        run: node --test tests/image-reference-project.test.ts tests/studio-form-model-pair.test.ts
      - name: Browser test for transparent image-reference masks
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/image-reference-crop.spec.ts
      - name: Type-check project
        if: always()
        run: npx tsc --noEmit
