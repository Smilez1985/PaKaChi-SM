name: PaKaChi image reference model regression
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/image-reference-test.yml'
      - 'src/image-reference.ts'
      - 'src/main.ts'
      - 'src/studio-data.ts'
      - 'src/studio-editor.ts'
      - 'src/image-reference-crop.ts'
      - 'src/image-reference-editor.ts'
      - 'src/generation-panel.ts'
      - 'src/ai-job-types.ts'
      - 'src/generation-adapter.ts'
      - 'server/generation.mjs'
      - 'tests/generation-service.test.mjs'
      - 'src/style.css'
      - 'tests/image-reference.test.ts'
      - 'tests/image-reference-crop.test.ts'
      - 'tests/generation-panel.test.ts'
      - 'tests/e2e/image-reference-crop.spec.ts'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Identify exact dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync('npm-audit.json','utf8')); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities??{}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range,severity:x.severity}),fixAvailable:v.fixAvailable,paths:v.nodes}))},null,2))"
      - name: Test image reference hierarchy and generation gate
        run: node --test tests/image-reference.test.ts
      - name: Test source-region crop planning
        run: node --test tests/image-reference-crop.test.ts
      - name: Test generation panel gating
        run: node --test tests/generation-panel.test.ts
      - name: Test generation HTTP transport and provenance sidecar
        run: node --test tests/generation-service.test.mjs
      - name: Test persisted image-reference project metadata
        run: node --test tests/image-reference-project.test.ts
      - name: Browser test for transparent image-reference masks
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/image-reference-crop.spec.ts
      - name: Type-check project
        if: always()
        run: npx tsc --noEmit
