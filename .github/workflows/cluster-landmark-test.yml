name: PaKaChi cluster landmark regression
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/cluster-landmark-test.yml'
      - 'src/cluster-*.ts'
      - 'src/studio-landmark-picking.ts'
      - 'src/studio-landmark-evidence.ts'
      - 'src/studio-form-manifest.ts'
      - 'src/studio-editor.ts'
      - 'src/main.ts'
      - 'src/style.css'
      - 'src/cluster-form-comparison-panel.ts'
      - 'src/studio-rig.ts'
      - 'src/avatar-candidate.ts'
      - 'src/studio-surface-hit.ts'
      - 'src/studio-view.ts'
      - 'tests/cluster-*.test.ts'
      - 'tests/studio-landmark-picking.test.ts'
      - 'tests/studio-form-manifest.test.ts'
      - 'tests/studio-editor.test.ts'
      - 'tests/studio-surface-hit.test.ts'
      - 'tests/e2e/studio-surface-pick.spec.ts'
      - 'tests/e2e/fixtures/studio-surface-pick.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cluster-landmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cluster-landmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit dependencies (including documented upstream exception)
        run: npm run audit:dependencies
      - name: Run cluster architecture, inventory, real PaKaChi asset and landmark regressions
        run: node --test --test-reporter=spec tests/cluster-architecture.test.ts tests/cluster-inventory.test.ts tests/cluster-landmark-classifier.test.ts tests/cluster-landmark-projection.test.ts tests/cluster-landmark-pipeline.test.ts tests/cluster-pakachi-assets.test.ts tests/cluster-2d-classifier.test.ts tests/cluster-landmark-correspondence.test.ts tests/cluster-form-comparison.test.ts tests/cluster-form-comparison-panel.test.ts tests/studio-landmark-picks.test.ts tests/studio-landmark-picking.test.ts tests/studio-surface-hit.test.ts tests/studio-form-manifest.test.ts tests/studio-editor.test.ts
      - name: Browser regression for real 3D surface picking
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/studio-surface-pick.spec.ts
      - name: Type-check project
        if: always()
        run: npx tsc --noEmit
